<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>동물의 한살이 — 통합 모둠 학습창</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#F5F3EE;--surface:#FFFFFF;--surface2:#F0EDE6;
  --primary:#2D6A4F;--primary-light:#52B788;--primary-pale:#D8F3DC;
  --s1:#E76F51;--s1p:#FDEBD0;--s2:#2176AE;--s2p:#DDEEFF;
  --gold:#E9C46A;--border:#DDD8CF;
  --text:#1A1A1A;--muted:#6B6560;--hint:#A09890;
  --r:12px;--rl:18px;--font:'Noto Sans KR',sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}

/* ── 모둠 선택 화면 ── */
#group-select-screen{position:fixed;inset:0;background:var(--primary);z-index:9999;display:flex;align-items:center;justify-content:center;}
.gs-box{background:#fff;border-radius:var(--rl);padding:32px;width:480px;max-width:95vw;}
.gs-box h2{font-size:22px;font-weight:700;color:var(--primary);margin-bottom:6px;}
.gs-box p{font-size:13px;color:var(--muted);margin-bottom:24px;}
.gs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.gs-btn{padding:20px 10px;border-radius:var(--r);border:2.5px solid var(--border);font-family:var(--font);font-size:16px;font-weight:700;cursor:pointer;background:var(--surface2);color:var(--muted);transition:all .2s;text-align:center;}
.gs-btn:hover{border-color:var(--primary-light);background:var(--primary-pale);color:var(--primary);}
.gs-btn.active{border-color:var(--primary);background:var(--primary);color:#fff;}
.gs-teacher{width:100%;padding:11px;border-radius:var(--r);border:1.5px dashed var(--border);font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:var(--muted);transition:all .2s;}
.gs-teacher:hover{background:var(--surface2);}
.gs-confirm{width:100%;padding:14px;border-radius:var(--r);border:none;font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff;margin-top:12px;display:none;}
.gs-confirm.vis{display:block;}

/* ── LOADING ── */
#loading-screen{position:fixed;inset:0;background:var(--primary);z-index:9998;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;}
.loading-dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.4);animation:ldot 1.2s infinite both;}
.loading-dot:nth-child(2){animation-delay:.2s;}
.loading-dot:nth-child(3){animation-delay:.4s;}
@keyframes ldot{0%,80%,100%{transform:scale(0);background:rgba(255,255,255,.3);}40%{transform:scale(1);background:#fff;}}
#loading-screen p{color:rgba(255,255,255,.7);font-size:14px;}

/* ── SYNC INDICATOR ── */
.sync-dot{width:8px;height:8px;border-radius:50%;background:#52B788;display:inline-block;margin-right:4px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* ── APP LAYOUT ── */
#app{display:none;flex-direction:column;min-height:100vh;}
.topbar{background:var(--primary);color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:8px;}
.topbar-left h1{font-size:15px;font-weight:700;}
.topbar-left .sub{font-size:11px;opacity:.7;margin-top:1px;}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.phase-badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;background:var(--gold);color:#333;white-space:nowrap;}
.tb-btn{padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.3);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;background:transparent;color:#fff;transition:all .2s;white-space:nowrap;}
.tb-btn:hover{background:rgba(255,255,255,.1);}
.tb-btn.green{background:#52B788;border-color:#52B788;}
.main{display:flex;flex:1;min-height:0;}
.sidebar{width:200px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 10px;gap:10px;overflow-y:auto;}
.sidebar h2{font-size:11px;font-weight:700;color:var(--primary);letter-spacing:.5px;text-transform:uppercase;padding-bottom:6px;border-bottom:1px solid var(--border);}
.phase-btns{display:flex;flex-direction:column;gap:5px;}
.phase-btn{padding:8px 10px;border-radius:var(--r);border:1.5px solid var(--border);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;background:var(--surface2);color:var(--muted);text-align:left;transition:all .2s;}
.phase-btn:hover{border-color:var(--primary-light);color:var(--primary);}
.phase-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.sb-label{font-size:10px;font-weight:700;color:var(--hint);letter-spacing:.5px;text-transform:uppercase;}
.group-nav{display:flex;flex-direction:column;gap:3px;}
.group-btn{padding:7px 8px;border-radius:var(--r);border:1px solid var(--border);font-family:var(--font);font-size:12px;cursor:pointer;background:var(--surface2);color:var(--muted);text-align:left;display:flex;align-items:center;gap:6px;transition:all .15s;}
.group-btn:hover{background:var(--primary-pale);color:var(--primary);}
.group-btn.active{background:var(--primary-pale);color:var(--primary);border-color:var(--primary-light);font-weight:700;}
.group-btn.mine{border-color:var(--primary-light);background:var(--primary-pale);color:var(--primary);}
.dot{width:7px;height:7px;border-radius:50%;background:#ccc;flex-shrink:0;}
.dot.s1c{background:var(--s1);}
.dot.s2c{background:var(--s2);}
.dot.donec{background:var(--gold);}
.all-btn{padding:7px;border-radius:var(--r);border:1.5px solid var(--primary);font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;background:#fff;color:var(--primary);text-align:center;transition:all .2s;}
.all-btn:hover{background:var(--primary-pale);}
.sb-action-btn{padding:7px;border-radius:var(--r);border:1.5px solid var(--border);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;background:#fff;color:var(--muted);text-align:center;transition:all .2s;}
.sb-action-btn:hover{background:var(--surface2);}
.content{flex:1;overflow-y:auto;padding:16px;}

/* ── 학생 모둠 뷰 (사이드바 없음) ── */
#student-app{display:none;flex-direction:column;min-height:100vh;}
.student-topbar{background:var(--primary);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.student-topbar h1{font-size:16px;font-weight:700;}
.student-topbar .sub{font-size:11px;opacity:.7;margin-top:2px;}
.student-content{flex:1;overflow-y:auto;padding:16px;max-width:900px;margin:0 auto;width:100%;}
.present-trigger-btn{padding:10px 22px;border-radius:var(--r);border:none;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;background:#52B788;color:#fff;display:flex;align-items:center;gap:6px;transition:all .2s;}
.present-trigger-btn:hover{background:#40997A;}
.present-trigger-btn:active{transform:scale(.97);}

/* ── OVERVIEW ── */
.overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
.ov-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:12px;cursor:pointer;transition:all .2s;}
.ov-card:hover{border-color:var(--primary-light);transform:translateY(-2px);box-shadow:0 4px 16px rgba(45,106,79,.1);}
.ov-title{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:8px;}
.ov-row{display:flex;align-items:center;gap:5px;font-size:11px;margin-bottom:3px;}
.ov-badge{padding:1px 6px;border-radius:6px;font-size:10px;font-weight:700;}
.b1{background:var(--s1p);color:var(--s1);}
.b2{background:var(--s2p);color:var(--s2);}
.ov-prog{height:3px;border-radius:2px;background:var(--surface2);margin-top:8px;overflow:hidden;}
.ov-prog-bar{height:100%;border-radius:2px;background:var(--primary-light);transition:width .5s;}

/* ── WORKSPACE ── */
.workspace{animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.ws-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.ws-title{font-size:18px;font-weight:700;color:var(--primary);}
.ws-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.ws-actions{display:flex;gap:6px;}
.ws-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--border);font-family:var(--font);font-size:12px;cursor:pointer;background:#fff;color:var(--muted);transition:all .2s;}
.ws-btn:hover{background:var(--surface2);}
.ws-btn.dark{background:#0a1628;color:#fff;border-color:#0a1628;}
.stage-panel{display:none;margin-bottom:14px;}
.stage-panel.vis{display:block;}
.stage-hdr{border-radius:var(--rl);padding:12px 14px;margin-bottom:12px;}
.hdr1{background:var(--s1p);border:1.5px solid #F4A261;}
.hdr2{background:var(--s2p);border:1.5px solid #90C2E7;}
.stage-htitle{font-size:14px;font-weight:700;margin-bottom:4px;}
.t1{color:var(--s1);}
.t2{color:var(--s2);}
.stage-hdesc{font-size:12px;color:var(--muted);}
.animal-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.a-label{font-size:12px;font-weight:500;color:var(--muted);}
.chips{display:flex;gap:5px;flex-wrap:wrap;}
.chip{padding:4px 12px;border-radius:16px;border:1.5px solid var(--border);font-family:var(--font);font-size:12px;cursor:pointer;background:#fff;color:var(--muted);transition:all .15s;}
.chip:hover{border-color:var(--s1);}
.chip.sel1{border-color:var(--s1);background:var(--s1);color:#fff;font-weight:700;}
.chip:hover.c2{border-color:var(--s2);}
.chip.sel2{border-color:var(--s2);background:var(--s2);color:#fff;font-weight:700;}
.locked{background:var(--surface2);border:1.5px dashed var(--border);border-radius:var(--rl);padding:28px;text-align:center;color:var(--hint);font-size:13px;}
.steps-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;}
.step-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px;}
.step-title{font-size:11px;font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:5px;}
.step-num{width:18px;height:18px;border-radius:50%;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.n1{background:var(--s1);}
.n2{background:var(--s2);}
.img-box{width:100%;height:80px;border:1.5px dashed var(--border);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--hint);cursor:pointer;margin-bottom:7px;background:var(--surface2);position:relative;overflow:hidden;transition:border-color .2s;}
.img-box:hover{border-color:var(--s1);}
.img-box img{width:100%;height:100%;object-fit:cover;position:absolute;}
.img-input{display:none;}
.step-ta{width:100%;border:1px solid var(--border);border-radius:7px;font-family:var(--font);font-size:11px;padding:5px 7px;resize:none;height:56px;color:var(--text);background:#fff;transition:border-color .2s;}
.step-ta:focus{outline:none;border-color:var(--s1);}
.step-ta.ta2:focus{border-color:var(--s2);}
.btn-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.save-btn{padding:8px 18px;border-radius:var(--r);border:none;font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff;}
.save-btn:hover{background:#1B4332;}
.save-btn.b2{background:var(--s2);}
.save-btn.b2:hover{background:#155083;}
.toast{font-size:11px;color:var(--primary);opacity:0;transition:opacity .3s;}
.toast.show{opacity:1;}

/* ── REALTIME BADGE ── */
.rt-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);background:var(--surface2);padding:3px 8px;border-radius:10px;}

/* ── PRESENT OVERLAY ── */
#present-overlay{position:fixed;inset:0;background:#07111f;z-index:1000;display:none;flex-direction:column;}
#present-overlay.vis{display:flex;}
.ptopbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap;gap:8px;}
.ptopbar h2{font-size:14px;font-weight:700;color:#fff;}
.ptopbar-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.pnav-btn{padding:6px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.2);font-family:var(--font);font-size:12px;cursor:pointer;background:transparent;color:#fff;transition:all .2s;}
.pnav-btn:hover{background:rgba(255,255,255,.1);}
.pnav-btn.pg{background:#52B788;border-color:#52B788;}
.pnav-btn.pr{border-color:rgba(255,100,80,.4);color:#ff9080;}
.p-stage-tabs{display:flex;gap:0;border-bottom:1px solid rgba(255,255,255,.08);padding:0 20px;}
.pstab{padding:9px 18px;font-family:var(--font);font-size:12px;font-weight:500;color:rgba(255,255,255,.45);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;}
.pstab.active{color:#fff;border-bottom-color:#52B788;}
.p-group-pills{display:flex;gap:6px;padding:10px 20px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.06);}
.pgpill{padding:5px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.18);font-family:var(--font);font-size:12px;cursor:pointer;color:rgba(255,255,255,.55);transition:all .2s;}
.pgpill:hover{color:#fff;background:rgba(255,255,255,.08);}
.pgpill.active{background:#52B788;border-color:#52B788;color:#fff;font-weight:700;}
.present-content{flex:1;overflow-y:auto;padding:20px;}
.pg-header{text-align:center;margin-bottom:20px;}
.pg-header h3{font-size:26px;font-weight:700;color:#fff;}
.pg-header p{font-size:13px;color:rgba(255,255,255,.5);margin-top:4px;}
.p-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.pcard{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;}
.pcard-step{font-size:10px;font-weight:700;color:#52B788;letter-spacing:.5px;}
.pcard-step.c2{color:#7EC8E3;}
.pcard-stitle{font-size:12px;font-weight:700;color:#fff;}
.pcard-img{width:100%;aspect-ratio:4/3;border-radius:7px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:26px;color:rgba(255,255,255,.2);overflow:hidden;}
.pcard-img img{width:100%;height:100%;object-fit:cover;}
.pcard-txt{font-size:11px;color:rgba(255,255,255,.65);line-height:1.6;min-height:32px;}
.pcard-empty{font-size:11px;color:rgba(255,255,255,.25);font-style:italic;}
.p-empty{text-align:center;padding:50px;color:rgba(255,255,255,.3);font-size:14px;}

/* ── 학생 발표 오버레이 — 닫기 불가 ── */
.student-present-notice{position:fixed;inset:0;background:#07111f;z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
.student-present-notice.vis{display:flex;}
.spn-icon{font-size:60px;}
.spn-title{font-size:24px;font-weight:700;color:#fff;}
.spn-sub{font-size:14px;color:rgba(255,255,255,.5);}

/* ── PRINT MODAL ── */
#print-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:none;align-items:center;justify-content:center;}
#print-modal.vis{display:flex;}
.modal{background:#fff;border-radius:var(--rl);padding:22px;width:460px;max-height:85vh;overflow-y:auto;font-family:var(--font);}
.modal h3{font-size:16px;font-weight:700;color:var(--primary);margin-bottom:4px;}
.modal p{font-size:12px;color:var(--muted);margin-bottom:14px;}
.modal-section{margin-bottom:14px;}
.modal-section-label{font-size:11px;font-weight:700;color:var(--hint);letter-spacing:.5px;text-transform:uppercase;margin-bottom:7px;}
.print-opts{display:flex;flex-direction:column;gap:6px;}
.popt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r);border:1.5px solid var(--border);cursor:pointer;transition:all .15s;}
.popt:hover{border-color:var(--primary-light);background:var(--primary-pale);}
.popt.sel{border-color:var(--primary);background:var(--primary-pale);}
.popt input[type=checkbox]{accent-color:var(--primary);width:15px;height:15px;}
.popt-label{font-size:13px;font-weight:500;}
.popt-sub{font-size:11px;color:var(--muted);}
.modal-btns{display:flex;gap:7px;justify-content:flex-end;margin-top:16px;}
.mbtn{padding:8px 18px;border-radius:var(--r);border:1px solid var(--border);font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:var(--muted);}
.mbtn.pri{background:var(--primary);color:#fff;border-color:var(--primary);}
.mbtn:hover{background:var(--surface2);}
.mbtn.pri:hover{background:#1B4332;}

/* ── TOAST NOTIFICATION ── */
#rt-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .3s;z-index:3000;pointer-events:none;}
#rt-toast.show{opacity:1;}
</style>
</head>
<body>

<!-- 모둠 선택 화면 -->
<div id="group-select-screen">
  <div class="gs-box">
    <h2>🌱 동물의 한살이</h2>
    <p>이 태블릿을 사용하는 모둠을 선택해 주세요.</p>
    <div class="gs-grid" id="gs-grid"></div>
    <button class="gs-confirm" id="gs-confirm" onclick="confirmGroup()">✅ 선택 완료</button>
    <button class="gs-teacher" onclick="enterTeacherMode()">👩‍🏫 교사 모드로 입장</button>
  </div>
</div>

<!-- 로딩 -->
<div id="loading-screen">
  <div style="display:flex;gap:8px;">
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
  </div>
  <p>Firebase 연결 중...</p>
</div>

<!-- ▼ 교사용 앱 전체 -->
<div class="app" id="app" style="display:none;">
  <div class="topbar">
    <div class="topbar-left">
      <h1>🌱 동물의 한살이 — 교사 화면</h1>
      <div class="sub">과학 3학년 1학기 4단원 &nbsp;·&nbsp; <span class="sync-dot"></span><span id="sync-status">실시간 연결됨</span></div>
    </div>
    <div class="topbar-right">
      <span class="phase-badge" id="global-phase-badge">📋 활동 전</span>
      <button class="tb-btn green" onclick="openPresent()">📺 공유 발표</button>
      <button class="tb-btn" onclick="openPrintModal()">🖨️ 인쇄</button>
    </div>
  </div>
  <div class="main">
    <div class="sidebar">
      <div>
        <h2>교사 컨트롤</h2>
        <div class="phase-btns">
          <button class="phase-btn active" id="pbtn-before" onclick="setPhase('before')">📋 활동 전</button>
          <button class="phase-btn" id="pbtn-stage1" onclick="setPhase('stage1')">🥚 STAGE 1 진행</button>
          <button class="phase-btn" id="pbtn-stage2" onclick="setPhase('stage2')">🐣 STAGE 2 진행</button>
          <button class="phase-btn" id="pbtn-after" onclick="setPhase('after')">🌟 활동 후 공유</button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px;">
        <div class="sb-label">모둠 이동</div>
        <div class="group-nav" id="group-nav"></div>
        <button class="all-btn" id="all-btn" onclick="showOverview()">전체 보기</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px;">
        <div class="sb-label">발표 / 출력</div>
        <button class="sb-action-btn" onclick="openPresent()">📺 공유 발표 화면</button>
        <button class="sb-action-btn" onclick="openPrintModal()">🖨️ 인쇄 설정</button>
      </div>
    </div>
    <div class="content" id="content-area"></div>
  </div>
</div>

<!-- ▼ 학생용 앱 (사이드바 없음) -->
<div id="student-app" style="display:none;flex-direction:column;min-height:100vh;">
  <div class="student-topbar">
    <div>
      <h1 id="student-title">🌱 동물의 한살이</h1>
      <div class="sub"><span class="sync-dot"></span><span id="student-sync-status">실시간 공유 중</span></div>
    </div>
    <button class="present-trigger-btn" id="present-trigger-btn" onclick="studentTriggerPresent()">
      📺 발표하기
    </button>
  </div>
  <div class="student-content" id="student-content-area"></div>
</div>

<!-- 학생 발표 대기 화면 -->
<div class="student-present-notice" id="student-present-notice">
  <div class="spn-icon">📺</div>
  <div class="spn-title">발표 화면이 열렸어요!</div>
  <div class="spn-sub">선생님이 발표를 마치면 자동으로 돌아와요.</div>
</div>

<!-- 발표 오버레이 (교사 전용 컨트롤) -->
<div id="present-overlay">
  <div class="ptopbar">
    <h2>📺 공유 발표 화면</h2>
    <div class="ptopbar-right">
      <button class="pnav-btn" onclick="prevGroup()">◀ 이전</button>
      <button class="pnav-btn" onclick="nextGroup()">다음 ▶</button>
      <button class="pnav-btn pr" id="close-present-btn" onclick="closePresent()">✕ 닫기</button>
    </div>
  </div>
  <div class="p-stage-tabs">
    <div class="pstab active" onclick="setPStage('s1')">🥚 STAGE 1</div>
    <div class="pstab" onclick="setPStage('s2')">🐣 STAGE 2</div>
    <div class="pstab" onclick="setPStage('all')">🌿 전체</div>
  </div>
  <div class="p-group-pills" id="p-group-pills"></div>
  <div class="present-content" id="present-content"></div>
</div>

<!-- 인쇄 모달 -->
<div id="print-modal">
  <div class="modal">
    <h3>🖨️ 인쇄 설정</h3>
    <p>인쇄할 모둠과 내용을 선택하세요.</p>
    <div class="modal-section">
      <div class="modal-section-label">모둠 선택</div>
      <div class="print-opts" id="print-group-opts"></div>
    </div>
    <div class="modal-section">
      <div class="modal-section-label">내용 선택</div>
      <div class="print-opts">
        <label class="popt sel" id="popt-s1"><input type="checkbox" id="pchk-s1" checked onchange="togglePopt('popt-s1')"><div><div class="popt-label">🥚 STAGE 1 — 알을 낳는 동물</div><div class="popt-sub">동물 선택 + 한살이 4단계 기록</div></div></label>
        <label class="popt sel" id="popt-s2"><input type="checkbox" id="pchk-s2" checked onchange="togglePopt('popt-s2')"><div><div class="popt-label">🐣 STAGE 2 — 새끼를 낳는 동물</div><div class="popt-sub">동물 선택 + 한살이 4단계 기록</div></div></label>
      </div>
    </div>
    <div class="modal-btns">
      <button class="mbtn" onclick="closePrintModal()">취소</button>
      <button class="mbtn pri" onclick="doPrint()">🖨️ 인쇄하기</button>
    </div>
  </div>
</div>

<!-- 실시간 토스트 -->
<div id="rt-toast"></div>

<script>
// ── DATA ──
const GROUPS = ['1모둠','2모둠','3모둠','4모둠','5모둠'];
const S1_ANIMALS = ['사마귀','바다거북','오리','개구리'];
const S2_ANIMALS = ['토끼','코끼리','돌고래','개'];
const S1_STEPS = ['알','애벌레(유충)','번데기','어른벌레(성체)'];
const S1_EMOJIS = ['🥚','🐛','🫧','🦋'];
const S2_EMOJIS = ['🐣','🐥','🐤','🐔'];
const S2_ANIMAL_STEPS = {
  '토끼': ['태어남(눈감은 새끼)','눈뜨고 젖 먹기','털 자라며 성장','어른 토끼'],
  '코끼리': ['태어남(약 100kg)','어미 옆에서 성장','무리 속 청소년기','어른 코끼리'],
  '돌고래': ['태어남(꼬리부터)','어미 젖 먹기','무리 사냥 배우기','어른 돌고래'],
  '개': ['태어남(눈감은 강아지)','젖 먹고 눈 뜨기','뛰고 놀며 성장','어른 개'],
};

let db = null;
let phase = 'before';
let currentView = 'overview';
let pStage = 's1';
let pGroup = 0;
let presentActive = false;
let groupData = {};
let _localTextTimers = {};
let myGroupIndex = null;   // null = 교사, 0~4 = 학생 모둠
let isTeacher = false;

GROUPS.forEach(g => {
  groupData[g] = {
    s1Animal:null, s1Steps:['','','',''], s1Images:[null,null,null,null],
    s2Animal:null, s2Steps:['','','',''], s2Images:[null,null,null,null],
    s1Done:false, s2Done:false
  };
});

// ── 모둠 선택 화면 ──
function buildGroupSelectScreen() {
  const saved = sessionStorage.getItem('myGroupIndex');
  const savedTeacher = sessionStorage.getItem('isTeacher');
  if (savedTeacher === '1') {
    enterTeacherModeDirectly();
    return;
  }
  if (saved !== null) {
    myGroupIndex = parseInt(saved);
    enterStudentMode();
    return;
  }
  // 선택 화면 표시
  const grid = document.getElementById('gs-grid');
  grid.innerHTML = GROUPS.map((g, i) =>
    `<button class="gs-btn" id="gsb-${i}" onclick="selectMyGroup(${i})">${g}</button>`
  ).join('');
  document.getElementById('group-select-screen').style.display = 'flex';
}

let _selectedGroup = null;
function selectMyGroup(i) {
  _selectedGroup = i;
  document.querySelectorAll('.gs-btn').forEach((b, bi) => b.classList.toggle('active', bi === i));
  const btn = document.getElementById('gs-confirm');
  btn.classList.add('vis');
  btn.textContent = `✅ ${GROUPS[i]}으로 입장`;
}
function confirmGroup() {
  if (_selectedGroup === null) return;
  myGroupIndex = _selectedGroup;
  sessionStorage.setItem('myGroupIndex', myGroupIndex);
  enterStudentMode();
}
function enterTeacherMode() {
  sessionStorage.setItem('isTeacher', '1');
  enterTeacherModeDirectly();
}
function enterTeacherModeDirectly() {
  isTeacher = true;
  document.getElementById('group-select-screen').style.display = 'none';
  document.getElementById('loading-screen').style.display = 'flex';
  initFirebase();
}
function enterStudentMode() {
  document.getElementById('group-select-screen').style.display = 'none';
  document.getElementById('loading-screen').style.display = 'flex';
  initFirebase();
}

// ── FIREBASE ──
function initFirebase() {
  try {
    let app;
    try { app = firebase.app(); } catch(e) { app = firebase.initializeApp({ databaseURL: 'https://msja-3-3-default-rtdb.firebaseio.com' }); }
    db = firebase.database(app);

    db.ref('.info/connected').on('value', snap => {
      const connected = snap.val();
      const statusEl = document.getElementById(isTeacher ? 'sync-status' : 'student-sync-status');
      if (statusEl) statusEl.textContent = connected ? (isTeacher ? '실시간 연결됨' : '실시간 공유 중') : '연결 끊김...';
    });

    db.ref('/').once('value').then(snap => {
      const data = snap.val();
      if (!data) {
        const initData = { phase: 'before', presentState: { active: false, group: 0, stage: 's1' }, groups: {} };
        GROUPS.forEach(g => {
          initData.groups[g] = { s1Animal:'',s1Steps:['','','',''],s1Images:['','','',''],s2Animal:'',s2Steps:['','','',''],s2Images:['','','',''],s1Done:false,s2Done:false };
        });
        db.ref('/').set(initData);
      }
      startListeners();
    });
  } catch(e) {
    alert('Firebase 연결 실패: ' + e.message);
  }
}

function startListeners() {
  db.ref('phase').on('value', snap => {
    const p = snap.val() || 'before';
    phase = p;
    if (isTeacher) { updatePhaseUI(p); redraw(); }
    else renderStudentArea();
  });

  db.ref('groups').on('value', snap => {
    const data = snap.val();
    if (!data) return;
    GROUPS.forEach(g => {
      if (data[g]) {
        const d = data[g];
        groupData[g] = {
          s1Animal: d.s1Animal || null,
          s1Steps: d.s1Steps || ['','','',''],
          s1Images: d.s1Images || [null,null,null,null],
          s2Animal: d.s2Animal || null,
          s2Steps: d.s2Steps || ['','','',''],
          s2Images: d.s2Images || [null,null,null,null],
          s1Done: d.s1Done || false,
          s2Done: d.s2Done || false,
        };
        ['s1Images','s2Images'].forEach(k => {
          groupData[g][k] = groupData[g][k].map(v => v === '' ? null : v);
        });
      }
    });

    if (isTeacher) {
      buildGroupNav();
      if (currentView === 'overview') renderOverviewArea();
      else updateWorkspacePartial();  // 커서 보존 방식으로 업데이트
    } else {
      updateStudentAreaPartial();  // 학생도 커서 보존
    }
    if (presentActive) renderPresent();
  });

  // presentState — 모든 태블릿에서 동시 반응
  db.ref('presentState').on('value', snap => {
    const ps = snap.val();
    if (!ps) return;

    if (ps.active) {
      pGroup = ps.group || 0;
      pStage = ps.stage || 's1';

      if (isTeacher) {
        // 교사: 발표 오버레이 표시
        if (!presentActive) {
          presentActive = true;
          document.getElementById('present-overlay').classList.add('vis');
        }
        document.querySelectorAll('.pstab').forEach((t,i) => t.classList.toggle('active', ['s1','s2','all'][i] === pStage));
        renderPresent();
      } else {
        // 학생: 발표 대기 화면 표시
        document.getElementById('student-present-notice').classList.add('vis');
        document.getElementById('student-app').style.display = 'none';
      }
    } else {
      // 발표 종료
      if (isTeacher) {
        presentActive = false;
        document.getElementById('present-overlay').classList.remove('vis');
      } else {
        document.getElementById('student-present-notice').classList.remove('vis');
        document.getElementById('student-app').style.display = 'flex';
      }
    }
  });

  document.getElementById('loading-screen').style.display = 'none';

  if (isTeacher) {
    document.getElementById('app').style.display = 'flex';
    buildGroupNav();
    showOverview();
  } else {
    document.getElementById('student-app').style.display = 'flex';
    document.getElementById('student-title').textContent = `🌱 ${GROUPS[myGroupIndex]} — 동물의 한살이`;
    renderStudentArea();
  }
}

// ── 학생: 발표 트리거 ──
function studentTriggerPresent() {
  // 학생이 발표 누르면 자기 모둠, s1부터 전체 공유 발표 시작
  dbSet('presentState', { active: true, group: myGroupIndex, stage: 's1' });
}

// ── DB WRITE HELPERS ──
function dbSet(path, value) {
  if (!db) return;
  db.ref(path).set(value);
}
function dbUpdate(path, value) {
  if (!db) return;
  db.ref(path).update(value);
}

// ── PHASE ──
function setPhase(p) {
  dbSet('phase', p);
}
function updatePhaseUI(p) {
  ['before','stage1','stage2','after'].forEach(x => document.getElementById(`pbtn-${x}`).classList.toggle('active', x === p));
  const labels = { before:'📋 활동 전', stage1:'🥚 STAGE 1 진행', stage2:'🐣 STAGE 2 진행', after:'🌟 활동 후 공유' };
  document.getElementById('global-phase-badge').textContent = labels[p];
}

// ── GROUP DATA WRITES ──
function selectA1(gi, a) {
  const g = GROUPS[gi];
  groupData[g].s1Animal = a;
  groupData[g].s1Done = false;
  dbUpdate(`groups/${g}`, { s1Animal: a, s1Done: false });
}
function selectA2(gi, a) {
  const g = GROUPS[gi];
  groupData[g].s2Animal = a;
  groupData[g].s2Done = false;
  dbUpdate(`groups/${g}`, { s2Animal: a, s2Done: false });
}
function saveText(gi, si, stage, val) {
  const g = GROUPS[gi];
  if (stage === 's1') groupData[g].s1Steps[si] = val;
  else groupData[g].s2Steps[si] = val;
  const key = `${gi}-${si}-${stage}`;
  clearTimeout(_localTextTimers[key]);
  _localTextTimers[key] = setTimeout(() => {
    const steps = stage === 's1' ? [...groupData[g].s1Steps] : [...groupData[g].s2Steps];
    dbSet(`groups/${g}/${stage}Steps`, steps);
  }, 800);
}
function uploadImg(gi, si, stage, input) {
  const f = input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = e => {
    const g = GROUPS[gi];
    const val = e.target.result;
    if (stage === 's1') groupData[g].s1Images[si] = val;
    else groupData[g].s2Images[si] = val;
    const imgs = stage === 's1' ? [...groupData[g].s1Images] : [...groupData[g].s2Images];
    dbSet(`groups/${g}/${stage}Images`, imgs.map(v => v || ''));
  };
  r.readAsDataURL(f);
}
function markDone(gi, stage) {
  const g = GROUPS[gi];
  if (stage === 's1') groupData[g].s1Done = true;
  else groupData[g].s2Done = true;
  dbUpdate(`groups/${g}`, stage === 's1' ? { s1Done: true } : { s2Done: true });
  buildGroupNav();
  showToast('저장됐어요! 🎉');
}

// ── NAVIGATION (교사) ──
function buildGroupNav() {
  document.getElementById('group-nav').innerHTML = GROUPS.map((g, i) => {
    const d = groupData[g];
    let dc = '';
    if (d.s1Done && d.s2Done) dc = 'donec';
    else if (d.s1Done) dc = 's2c';
    else if (d.s1Animal) dc = 's1c';
    return `<button class="group-btn ${currentView===`group-${i}`?'active':''}" onclick="showGroup(${i})"><span class="dot ${dc}"></span>${g}</button>`;
  }).join('');
}
function showOverview() {
  currentView = 'overview';
  const ab = document.getElementById('all-btn');
  ab.style.background = 'var(--primary)'; ab.style.color = '#fff';
  buildGroupNav();
  renderOverviewArea();
}
function showGroup(i) {
  currentView = `group-${i}`;
  const ab = document.getElementById('all-btn');
  ab.style.background = ''; ab.style.color = '';
  buildGroupNav();
  renderWorkspaceArea(i);
}
function redraw() {
  if (currentView === 'overview') renderOverviewArea();
  else { const i = parseInt(currentView.split('-')[1]); renderWorkspaceArea(i); }
}

// ── OVERVIEW RENDER ──
function renderOverviewArea() {
  let h = '';
  if (phase === 'before') {
    h += `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px;margin-bottom:14px;">
    <div style="font-size:13px;font-weight:700;color:var(--primary);margin-bottom:8px;">🎓 교사 안내 — 활동 전 준비</div>
    <div style="font-size:12px;color:var(--muted);line-height:1.8;">왼쪽 패널에서 단계를 선택해 활동을 열고 닫을 수 있어요.<br>
    모든 태블릿이 <b>실시간으로 연결</b>되어 같은 모둠원끼리 내용을 공유할 수 있어요.<br>
    📺 공유 발표를 누르면 <b>모든 태블릿 화면이 동시에 발표 화면으로 전환</b>돼요.</div>
    </div>`;
  }
  if (phase === 'after') {
    h += `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px;margin-bottom:14px;">
    <div style="font-size:13px;font-weight:700;color:var(--primary);margin-bottom:10px;">📊 전체 모둠 현황</div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;">
    ${GROUPS.map(g => {
      const d = groupData[g];
      return `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:10px;text-align:center;">
        <div style="font-size:12px;font-weight:700;color:var(--primary);margin-bottom:5px;">${g}</div>
        <div style="font-size:11px;color:var(--muted);">🥚 ${d.s1Animal||'미선택'}</div>
        <span style="display:inline-block;padding:1px 6px;border-radius:5px;font-size:10px;font-weight:700;${d.s1Done?'background:var(--primary-pale);color:var(--primary)':d.s1Animal?'background:var(--s1p);color:var(--s1)':'background:var(--surface2);color:var(--hint)'}">${d.s1Done?'완료':d.s1Animal?'진행중':'시작전'}</span>
        <div style="font-size:11px;color:var(--muted);margin-top:4px;">🐣 ${d.s2Animal||'미선택'}</div>
        <span style="display:inline-block;padding:1px 6px;border-radius:5px;font-size:10px;font-weight:700;${d.s2Done?'background:var(--primary-pale);color:var(--primary)':d.s2Animal?'background:var(--s2p);color:var(--s2)':'background:var(--surface2);color:var(--hint)'}">${d.s2Done?'완료':d.s2Animal?'진행중':'시작전'}</span>
      </div>`;
    }).join('')}
    </div></div>`;
  }
  h += `<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px;">모둠별 진행 현황 — 클릭하면 해당 모둠 학습창으로 이동해요</div>
  <div class="overview-grid">${GROUPS.map((g, i) => {
    const d = groupData[g];
    let prog = 0;
    if (d.s1Animal) prog += 25; if (d.s1Done) prog += 25;
    if (d.s2Animal) prog += 25; if (d.s2Done) prog += 25;
    return `<div class="ov-card" onclick="showGroup(${i})">
      <div class="ov-title">🌿 ${g}</div>
      <div class="ov-row"><span class="ov-badge b1">STAGE 1</span><span style="font-size:11px;color:var(--muted);">${d.s1Animal||'미선택'}</span></div>
      <div class="ov-row"><span class="ov-badge b2">STAGE 2</span><span style="font-size:11px;color:var(--muted);">${d.s2Animal||'미선택'}</span></div>
      <div class="ov-prog"><div class="ov-prog-bar" style="width:${prog}%"></div></div>
    </div>`;
  }).join('')}</div>`;
  document.getElementById('content-area').innerHTML = h;
}

// ── 워크스페이스 빌드 HTML ──
function buildWorkspaceHTML(i) {
  const g = GROUPS[i], d = groupData[g];
  let h = `<div class="workspace">
  <div class="ws-header">
    <div><div class="ws-title">🌿 ${g} 학습창</div><div class="ws-sub">동물의 한살이 조사 활동 &nbsp;<span class="rt-badge"><span class="sync-dot" style="width:6px;height:6px;"></span>실시간 공유</span></div></div>
    <div class="ws-actions">
      <button class="ws-btn dark" onclick="openPresentGroup(${i})">📺 발표</button>
      <button class="ws-btn" onclick="openPrintModalGroup(${i})">🖨️ 인쇄</button>
    </div>
  </div>`;
  h += buildStage1HTML(i, g, d);
  h += buildStage2HTML(i, g, d);
  h += `</div>`;
  return h;
}

function buildStage1HTML(i, g, d) {
  let h = `<div class="stage-panel ${(phase==='stage1'||phase==='after')?'vis':''}">`;
  if (phase === 'before') {
    h += `<div class="locked"><div style="font-size:26px;margin-bottom:8px;">🔒</div>아직 활동이 시작되지 않았어요.<br>선생님이 STAGE 1을 열면 시작할 수 있어요.</div>`;
  } else {
    h += `<div class="stage-hdr hdr1"><div class="stage-htitle t1">🥚 STAGE 1 — 알을 낳는 동물</div><div class="stage-hdesc">동물 하나를 선택하고, 한살이 4단계를 그림과 글로 조사해서 기록해요.</div></div>
    <div class="animal-row"><div class="a-label">동물 선택:</div><div class="chips">
    ${S1_ANIMALS.map(a => `<span class="chip ${d.s1Animal===a?'sel1':''}" onclick="selectA1(${i},'${a}')">${a}</span>`).join('')}
    </div></div>`;
    if (d.s1Animal) {
      h += `<div class="steps-grid">`;
      S1_STEPS.forEach((step, si) => {
        h += `<div class="step-card">
          <div class="step-title"><span class="step-num n1">${si+1}</span><span style="color:var(--s1);">${S1_EMOJIS[si]} ${step}</span></div>
          <div class="img-box" onclick="document.getElementById('s1img-${i}-${si}').click()">
            ${d.s1Images[si] ? `<img src="${d.s1Images[si]}">` : '📷 사진/그림 추가'}
            <input type="file" class="img-input" id="s1img-${i}-${si}" accept="image/*" onchange="uploadImg(${i},${si},'s1',this)">
          </div>

function updateChips(i, d) {
  document.querySelectorAll(`.chip`).forEach(chip => {
    const txt = chip.textContent.trim();
    if (S1_ANIMALS.includes(txt)) chip.classList.toggle('sel1', txt === d.s1Animal);

  });
}
function updateImages(i, d) {
  S1_STEPS.forEach((_, si) => {
    const box = document.querySelector(`#s1img-${i}-${si}`)?.closest('.img-box');

        box.childNodes.forEach(n => { if (n.nodeType === 3) n.remove(); });

}

function updateStudentAreaPartial() {

  // chip 상태 업데이트

  });

  // 포커스 없는 textarea만 업데이트
  S1_STEPS.forEach((_, si) => {

// ── PRESENT ──
function openPresent() {
  pGroup = 0; pStage = 's1';
  dbSet('presentState', { active: true, group: 0, stage: 's1' });
}
function openPresentGroup(i) {
  pGroup = i; pStage = 's1';
  dbSet('presentState', { active: true, group: i, stage: 's1' });
}
function closePresent() {
  dbSet('presentState', { active: false, group: pGroup, stage: pStage });
}
function prevGroup() {
  const ng = Math.max(0, pGroup-1);
  dbSet('presentState', { active:true, group:ng, stage:pStage });
}
function nextGroup() {
  const ng = Math.min(GROUPS.length-1, pGroup+1);
  dbSet('presentState', { active:true, group:ng, stage:pStage });
}
function setPStage(s) {
  pStage = s;
  dbSet('presentState', { active:true, group:pGroup, stage:s });
  document.querySelectorAll('.pstab').forEach((t,i) => t.classList.toggle('active', ['s1','s2','all'][i] === s));
}
function setPGroup(i) {
  pGroup = i;
  dbSet('presentState', { active:true, group:i, stage:pStage });
}

function renderPresent() {
  document.getElementById('p-group-pills').innerHTML = GROUPS.map((g,i) =>
    `<div class="pgpill ${pGroup===i?'active':''}" onclick="setPGroup(${i})">${g}</div>`
  ).join('');

  const g = GROUPS[pGroup], d = groupData[g];
  const area = document.getElementById('present-content');
  let h = '';

  function pCards(animal, steps, emojis, imgs, texts, cls) {
    if (!animal) return `<div class="p-empty">아직 동물이 선택되지 않았어요.</div>`;
    return `<div style="text-align:center;margin-bottom:16px;"><div style="font-size:24px;font-weight:700;color:#fff;">${animal}의 한살이</div></div>
    <div class="p-cards">${steps.map((step,si) => `
      <div class="pcard">
        <div class="pcard-step ${cls}">${si+1}단계</div>
        <div class="pcard-stitle">${emojis[si]||'🐾'} ${step}</div>
        <div class="pcard-img">${imgs[si]?`<img src="${imgs[si]}" alt="${step}">`:'📷'}</div>
        <div class="${texts[si]?'pcard-txt':'pcard-empty'}">${texts[si]||'아직 내용이 없어요.'}</div>
      </div>`).join('')}</div>`;
  }

  const steps2 = d.s2Animal ? (S2_ANIMAL_STEPS[d.s2Animal]||['태어남','어린 시기','성장기','어른']) : ['태어남','어린 시기','성장기','어른'];

  if (pStage === 'all') {
    h += `<div class="pg-header"><h3>🌿 ${g}</h3><p>STAGE 1 + STAGE 2 전체 결과</p></div>`;
    h += `<div style="font-size:12px;font-weight:700;color:#52B788;margin-bottom:8px;letter-spacing:.5px;">🥚 STAGE 1 — 알을 낳는 동물 · ${d.s1Animal||'미선택'}</div>`;
    h += pCards(d.s1Animal, S1_STEPS, S1_EMOJIS, d.s1Images, d.s1Steps, '');
    h += `<div style="margin:18px 0 8px;font-size:12px;font-weight:700;color:#7EC8E3;letter-spacing:.5px;">🐣 STAGE 2 — 새끼를 낳는 동물 · ${d.s2Animal||'미선택'}</div>`;
    h += pCards(d.s2Animal, steps2, S2_EMOJIS, d.s2Images, d.s2Steps, 'c2');
  } else if (pStage === 's1') {
    h += `<div class="pg-header"><h3>🌿 ${g}</h3><p>🥚 STAGE 1 — 알을 낳는 동물 조사</p></div>`;
    h += pCards(d.s1Animal, S1_STEPS, S1_EMOJIS, d.s1Images, d.s1Steps, '');
  } else {
    h += `<div class="pg-header"><h3>🌿 ${g}</h3><p>🐣 STAGE 2 — 새끼를 낳는 동물 조사</p></div>`;
    h += pCards(d.s2Animal, steps2, S2_EMOJIS, d.s2Images, d.s2Steps, 'c2');
  }
  area.innerHTML = h;
}

      S1_STEPS.forEach((step,si) => {
        body += `<div class="card"><div class="cs">${si+1}단계</div><div class="ct">${S1_EMOJIS[si]} ${step}</div>
        <div class="ci">${d.s1Images[si]?`<img src="${d.s1Images[si]}">`:`<span>📷</span>`}</div>
        <div class="cd ${d.s1Steps[si]?'':'empty'}">${d.s1Steps[si]||'(설명 입력)'}</div></div>`;
      });
      body += `</div></div>`;
    }
    if (inclS2) {
      const steps2 = d.s2Animal ? (S2_ANIMAL_STEPS[d.s2Animal]||['태어남','어린 시기','성장기','어른']) : ['태어남','어린 시기','성장기','어른'];
      body += `<div class="sb"><span class="sl sl2">🐣 STAGE 2 — 새끼를 낳는 동물</span>${d.s2Animal?`<span class="atag at2">${d.s2Animal}</span>`:''}<div class="cg">`;
      steps2.forEach((step,si) => {
        body += `<div class="card"><div class="cs">${si+1}단계</div><div class="ct">${S2_EMOJIS[si]||'🐾'} ${step}</div>
        <div class="ci">${d.s2Images[si]?`<img src="${d.s2Images[si]}">`:`<span>📷</span>`}</div>
        <div class="cd ${d.s2Steps[si]?'':'empty'}">${d.s2Steps[si]||'(설명 입력)'}</div></div>`;
      });
      body += `</div></div>`;
    }
    body += `<div class="foot"><span>🌱 동물의 한살이 — ${g}</span><span>과학 3학년 1학기 4단원</span></div></div>`;
  });
  body += `</body></html>`;
  pw.document.write(body); pw.document.close();
  pw.onload = () => { pw.focus(); pw.print(); };
  closePrintModal();
}

// ── TOAST ──
let _toastTimer;
function showToast(msg) {
  const t = document.getElementById('rt-toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── START ──
window.addEventListener('DOMContentLoaded', buildGroupSelectScreen);
</script>
